name: Deploy (production)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_ASSET_WEBP_BASE_URL: ${{ secrets.VITE_ASSET_WEBP_BASE_URL }}
      VITE_ASSET_ORIGINAL_BASE_URL: ${{ secrets.VITE_ASSET_ORIGINAL_BASE_URL }}
      VITE_ASSET_DEFAULT_VARIANT: ${{ secrets.VITE_ASSET_DEFAULT_VARIANT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: dist/
          server-dir: public_html/
